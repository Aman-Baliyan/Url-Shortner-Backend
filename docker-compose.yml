# Docker Compose file for Spring Boot + MySQL + Redis stack
services:
  # Spring Boot application service
  registry:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER}
    depends_on:
      registry:
        condition: service_started
    restart: unless-stopped

  app:
    build:
      context: ./url-service
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_REDIS_URL_HOST: ${REDIS_URL_HOST}
      SPRING_REDIS_URL_PORT: ${REDIS_URL_PORT}
      SPRING_REDIS_URL_PASSWORD: ${REDIS_URL_PASSWORD}
      SPRING_REDIS_COUNTER_HOST: ${REDIS_COUNTER_HOST}
      SPRING_REDIS_COUNTER_PORT: ${REDIS_COUNTER_PORT}
      SPRING_REDIS_COUNTER_PASSWORD: ${REDIS_COUNTER_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER}
    depends_on:
      registry:
        condition: service_started
      gateway:
        condition: service_started
      mysql:
        condition: service_healthy
      redis-url:
        condition: service_healthy
      redis-counter:
        condition: service_healthy
    restart: unless-stopped

  # MySQL database service
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
#    volumes:
#      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
#    networks:
#      - app-network

  # Redis caching service for URLs
  redis-url:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_URL_PASSWORD}
    # volumes:
    #   - redis-url-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass ${REDIS_URL_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
#    networks:
#      - app-network

  # Redis caching service for counters
  redis-counter:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_COUNTER_PASSWORD}
    # volumes:
    #   - redis-counter-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass ${REDIS_COUNTER_PASSWORD} --appendonly yes
#    networks:
#      - app-network

