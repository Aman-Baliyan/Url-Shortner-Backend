events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HTTP: Redirect all traffic to HTTPS
    server {
        listen 80;
        server_name a.urlss.site;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: Secure Gateway Proxy
    server {
        listen 443 ssl;
        server_name a.urlss.site;

        ssl_certificate /etc/letsencrypt/live/api.my-domain.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.my-domain.site/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            # Swarm internal routing balances traffic to the gateway service
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
