# config only for testing


spring.application.name=url-service
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/UrlData?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=aman
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

## Redis Configuration url
spring.redis.url.host=localhost
spring.redis.url.port=16379
spring.redis.url.password=mypass


## Redis Configuration counter
spring.redis.counter.host=localhost
spring.redis.counter.port=16379
spring.redis.counter.password=mypass


